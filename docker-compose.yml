services:
  # Servidor Web (Nginx)
  webserver:
    image: nginx:alpine
    container_name: helpdesk_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - helpdesk_network

  # Backend (PHP/Laravel)
  backend:
    image: php:8.4-fpm-alpine
    container_name: helpdesk_backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - helpdesk_network
    # Instalamos extensiones necesarias de Postgres para PHP
    command: sh -c "apk add --no-cache postgresql-dev && docker-php-ext-install pdo pdo_pgsql && php-fpm"

  # Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - helpdesk_network

  # Frontend (Next.js)
  frontend:
    image: node:20-alpine
    container_name: helpdesk_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    networks:
      - helpdesk_network
    # Mantiene el contenedor vivo mientras instalamos Next.js
    command: sh -c "if [ ! -f package.json ]; then tail -f /dev/null; else npm run dev; fi"

volumes:
  db_data:

networks:
  helpdesk_network:
    driver: bridge